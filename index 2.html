<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#080d18">
<title>fuck guns — Neon Arena</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080d18;color:#fff;font-family:system-ui,-apple-system,Segoe UI,sans-serif;touch-action:none}#game{display:block;width:100vw;height:100dvh}
#hud{position:fixed;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;gap:6px;pointer-events:none;font-weight:850;text-shadow:0 2px 8px #000}.pill{background:#101a2be8;border:1px solid #ffffff26;border-radius:12px;padding:7px 10px;font-size:12px}
#overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:18px;background:linear-gradient(#050914cc,#050914ed);overflow:auto}.panel{width:min(440px,100%);background:#111b2b;border:1px solid #ffffff24;border-radius:22px;padding:24px 20px;text-align:center;box-shadow:0 20px 80px #0009}h1{margin:0 0 8px;font-size:clamp(32px,9vw,46px);letter-spacing:-1px}p{color:#b8c6da;line-height:1.45;margin:10px 0 18px}.mainbtn,.shopbtn{border:0;border-radius:13px;background:#55e6a5;color:#08131a;font-weight:900;font-size:17px;padding:13px 16px;width:100%}.shopbtn{font-size:13px;padding:11px 8px;background:#26364d;color:#fff;border:1px solid #ffffff20}.shopbtn:disabled{opacity:.4}.shopgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:12px 0}.small{font-size:12px;color:#91a5c0}.statline{display:flex;justify-content:space-between;background:#0b1321;border-radius:10px;padding:9px 12px;margin:7px 0;font-size:13px}
#controls{position:fixed;bottom:14px;left:14px;right:14px;display:flex;justify-content:space-between;align-items:end;pointer-events:none}.pad{display:grid;grid-template-columns:48px 48px 48px;grid-template-rows:48px 48px 48px;gap:4px;pointer-events:auto}.ctrl{width:48px;height:48px;border-radius:14px;border:1px solid #ffffff38;background:#17243ad9;color:white;font-size:20px;font-weight:900;touch-action:none;user-select:none}.ctrl:active{background:#55e6a5;color:#06120d}.empty{visibility:hidden}#fire{width:80px;height:80px;border-radius:50%;background:#ff5e6cdd;border:2px solid #ffffff75;color:white;font-size:14px;font-weight:900;pointer-events:auto;touch-action:none}#hint{position:fixed;bottom:122px;left:0;right:0;text-align:center;font-size:11px;color:#b6c2d4;pointer-events:none;text-shadow:0 2px 5px #000}
@media(min-width:700px){#controls{max-width:700px;margin:auto}.pill{font-size:14px}}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud"><div class="pill">❤️ <span id="hp">3</span></div><div class="pill">🪙 <span id="coins">0</span></div><div class="pill">SCORE <span id="score">0</span></div><div class="pill">WAVE <span id="wave">1</span></div></div>
<div id="hint">Сумтай товчоор хөдөл · FIRE дарж бууд · Буугаа дэлгүүрээс сайжруул</div>
<div id="controls"><div class="pad">
<button class="ctrl empty"></button><button class="ctrl" data-dir="up">▲</button><button class="ctrl empty"></button>
<button class="ctrl" data-dir="left">◀</button><button class="ctrl" data-dir="down">▼</button><button class="ctrl" data-dir="right">▶</button>
<button class="ctrl empty"></button><button class="ctrl empty"></button><button class="ctrl empty"></button>
</div><button id="fire">FIRE</button></div>
<div id="overlay"><div class="panel">
<h1>fuck guns</h1><p>NEON ARENA SHOOTER<br>Дайснуудаас бултаж, оноо болон зоос цуглуул!</p>
<div class="statline"><span>Зэвсэг</span><b id="menuWeapon">Pistol</b></div>
<div class="statline"><span>Дүрийн хурд</span><b id="menuSpeed">1-р түвшин</b></div>
<div class="shopgrid">
<button class="shopbtn" id="buyRapid">⚡ Rapid Fire<br><span class="small">30 зоос</span></button>
<button class="shopbtn" id="buyShotgun">💥 Shotgun<br><span class="small">50 зоос</span></button>
<button class="shopbtn" id="buyHeal">❤️ +1 амь<br><span class="small">25 зоос</span></button>
<button class="shopbtn" id="buySpeed">👟 Хурд нэмэх<br><span class="small">20 зоос</span></button>
</div>
<p class="small" id="shopMessage">Тоглоомын өмнө зэвсэг сонгож болно. Оноогоор зоос цуглуулна.</p>
<button class="mainbtn" id="start">ТОГЛОЖ ЭХЛЭХ</button>
<p class="small">Компьютер: WASD / сум + Space</p>
</div></div>
<script>
(()=> {
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
const $=id=>document.getElementById(id);
let W=0,H=0,dpr=1,running=false,score=0,coins=0,hp=3,wave=1,last=0,spawnClock=0,shootClock=0,invuln=0,weapon='Pistol',speedLevel=1,rapidOwned=false,shotgunOwned=false;
let bullets=[],enemies=[],particles=[];
const keys={up:false,down:false,left:false,right:false,fire:false};
const player={x:0,y:0,r:14,speed:235};
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*dpr;canvas.height=H*dpr;canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(dpr,0,0,dpr,0,0);if(!player.x){player.x=W/2;player.y=H*.58}player.x=Math.max(15,Math.min(W-15,player.x));player.y=Math.max(70,Math.min(H-15,player.y))}
addEventListener('resize',resize);resize();
function hud(){$('hp').textContent=hp;$('coins').textContent=coins;$('score').textContent=score;$('wave').textContent=wave;$('menuWeapon').textContent=weapon;$('menuSpeed').textContent=speedLevel+'-р түвшин';$('buyRapid').disabled=rapidOwned||coins<30;$('buyShotgun').disabled=shotgunOwned||coins<50;$('buyHeal').disabled=coins<25||hp>=5;$('buySpeed').disabled=coins<20||speedLevel>=5}
function reset(){score=0;coins=0;hp=3;wave=1;bullets=[];enemies=[];particles=[];spawnClock=.3;shootClock=0;invuln=0;player.x=W/2;player.y=H*.58;player.speed=235+(speedLevel-1)*20;hud()}
function burst(x,y,color,n=8){for(let i=0;i<n;i++){let a=Math.random()*Math.PI*2,s=35+Math.random()*145;particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:.25+Math.random()*.35,color})}}
function spawnEnemy(){let side=Math.floor(Math.random()*4),x,y;if(side===0){x=Math.random()*W;y=-25}else if(side===1){x=W+25;y=Math.random()*H}else if(side===2){x=Math.random()*W;y=H+25}else{x=-25;y=Math.random()*H}let r=11+Math.random()*8;enemies.push({x,y,r,speed:48+Math.random()*28+wave*5,hp:r>17?2:1,rot:Math.random()*6,kind:Math.random()<.18?'fast':'normal'})}
function nearest(){let b=null,d0=Infinity;for(const e of enemies){let d=Math.hypot(e.x-player.x,e.y-player.y);if(d<d0){d0=d;b=e}}return b}
function fireOne(dx,dy,speed=520){bullets.push({x:player.x+dx*18,y:player.y+dy*18,vx:dx*speed,vy:dy*speed,r:4,life:1.1});burst(player.x+dx*15,player.y+dy*15,'#70f7d0',2)}
function shoot(){let e=nearest(),dx=0,dy=-1;if(e){let d=Math.hypot(e.x-player.x,e.y-player.y)||1;dx=(e.x-player.x)/d;dy=(e.y-player.y)/d}
if(weapon==='Shotgun'){for(let i=-2;i<=2;i++){let a=Math.atan2(dy,dx)+i*.16;fireOne(Math.cos(a),Math.sin(a),430)}}else fireOne(dx,dy,weapon==='Rapid Fire'?590:520)}
function update(dt){if(!running)return;invuln=Math.max(0,invuln-dt);let dx=(keys.right?1:0)-(keys.left?1:0),dy=(keys.down?1:0)-(keys.up?1:0),m=Math.hypot(dx,dy)||1;player.x+=dx/m*player.speed*dt;player.y+=dy/m*player.speed*dt;player.x=Math.max(14,Math.min(W-14,player.x));player.y=Math.max(68,Math.min(H-14,player.y));
shootClock-=dt;if(keys.fire&&shootClock<=0){shoot();shootClock=weapon==='Rapid Fire'?.095:weapon==='Shotgun'?.42:.2}
spawnClock-=dt;if(spawnClock<=0){spawnEnemy();spawnClock=Math.max(.23,1.02-wave*.05)}
for(const b of bullets){b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt}bullets=bullets.filter(b=>b.life>0&&b.x>-20&&b.x<W+20&&b.y>-20&&b.y<H+20);
for(const e of enemies){let vx=player.x-e.x,vy=player.y-e.y,d=Math.hypot(vx,vy)||1;e.x+=vx/d*e.speed*(e.kind==='fast'?1.45:1)*dt;e.y+=vy/d*e.speed*(e.kind==='fast'?1.45:1)*dt;e.rot+=dt*4;if(d<e.r+player.r&&invuln<=0){hp--;invuln=1.1;burst(player.x,player.y,'#ff6677',14);hud();if(hp<=0){gameOver();return}}}
for(const b of bullets){for(const e of enemies){if(e.dead||b.life<=0)continue;if(Math.hypot(b.x-e.x,b.y-e.y)<b.r+e.r){b.life=0;e.hp--;burst(b.x,b.y,'#ffe07a',3);if(e.hp<=0){e.dead=true;score+=10;coins+=2;burst(e.x,e.y,e.kind==='fast'?'#f9a84b':'#ff6677',10)}}}}
enemies=enemies.filter(e=>!e.dead);for(const p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;p.vx*=.97;p.vy*=.97}particles=particles.filter(p=>p.life>0);let nw=1+Math.floor(score/100);if(nw!==wave)wave=nw;hud()}
function draw(){ctx.clearRect(0,0,W,H);let g=ctx.createLinearGradient(0,0,W,H);g.addColorStop(0,'#091226');g.addColorStop(1,'#10152b');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.strokeStyle='#26375566';let grid=38,off=(performance.now()*.012)%grid;for(let x=0;x<W;x+=grid){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}for(let y=off;y<H;y+=grid){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}ctx.strokeStyle='#55e6a51c';ctx.lineWidth=2;ctx.beginPath();ctx.arc(W/2,H*.5,Math.min(W,H)*.32,0,Math.PI*2);ctx.stroke();
for(const b of bullets){ctx.fillStyle='#70f7d0';ctx.shadowColor='#70f7d0';ctx.shadowBlur=12;ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,7);ctx.fill()}ctx.shadowBlur=0;
for(const e of enemies){ctx.save();ctx.translate(e.x,e.y);ctx.rotate(e.rot*.2);ctx.shadowColor=e.kind==='fast'?'#f9a84b':'#ff536b';ctx.shadowBlur=14;ctx.fillStyle=e.kind==='fast'?'#f9a84b':'#ff536b';ctx.beginPath();ctx.moveTo(0,-e.r);ctx.lineTo(e.r*.85,0);ctx.lineTo(0,e.r);ctx.lineTo(-e.r*.85,0);ctx.closePath();ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#260b1a';ctx.beginPath();ctx.arc(-4,-2,2,0,7);ctx.arc(4,-2,2,0,7);ctx.fill();ctx.restore()}
for(const p of particles){ctx.globalAlpha=Math.max(0,p.life*2);ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,2.5,0,7);ctx.fill()}ctx.globalAlpha=1;
if(invuln<=0||Math.floor(invuln*12)%2===0){ctx.save();ctx.translate(player.x,player.y);ctx.shadowColor='#55e6a5';ctx.shadowBlur=22;ctx.fillStyle='#55e6a5';ctx.beginPath();ctx.arc(0,0,player.r,0,7);ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#0b2b27';ctx.beginPath();ctx.arc(-4,-3,2,0,7);ctx.arc(4,-3,2,0,7);ctx.fill();ctx.strokeStyle='#d8fff1';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(0,-player.r-2);ctx.lineTo(0,-player.r-10);ctx.stroke();ctx.restore()}}
function gameOver(){running=false;$('overlay').style.display='flex';$('overlay').querySelector('h1').textContent='GAME OVER';$('overlay').querySelector('p').innerHTML='Оноо: <b>'+score+'</b> · Зоос: <b>'+coins+'</b><br>Дэлгүүрээс сайжруулалт аваад дахин тогло!';$('start').textContent='ДАХИН ТОГЛОХ';hud()}
function shop(cost,fn){if(coins<cost){$('shopMessage').textContent='Зоос хүрэлцэхгүй байна. Дайснаа устгаж зоос цуглуулаарай.';return}coins-=cost;fn();$('shopMessage').textContent='Сайжруулалт авлаа! Дахин тоглоход хүчинтэй.';hud()}
$('buyRapid').onclick=()=>{if(rapidOwned)return;shop(30,()=>{rapidOwned=true;weapon='Rapid Fire'})};
$('buyShotgun').onclick=()=>{if(shotgunOwned)return;shop(50,()=>{shotgunOwned=true;weapon='Shotgun'})};
$('buyHeal').onclick=()=>{if(hp>=5)return;shop(25,()=>{hp=Math.min(5,hp+1)})};
$('buySpeed').onclick=()=>{if(speedLevel>=5)return;shop(20,()=>{speedLevel++;player.speed=235+(speedLevel-1)*20})};
$('start').onclick=()=>{reset();running=true;$('overlay').style.display='none';$('overlay').querySelector('h1').textContent='fuck guns';$('overlay').querySelector('p').innerHTML='NEON ARENA SHOOTER<br>Дайснуудаас бултаж, оноо болон зоос цуглуул!';$('start').textContent='ТОГЛОЖ ЭХЛЭХ'};
document.querySelectorAll('[data-dir]').forEach(btn=>{let d=btn.dataset.dir;const on=e=>{e.preventDefault();keys[d]=true;try{btn.setPointerCapture(e.pointerId)}catch(_){}};const off=e=>{e.preventDefault();keys[d]=false};btn.addEventListener('pointerdown',on);btn.addEventListener('pointerup',off);btn.addEventListener('pointercancel',off);btn.addEventListener('lostpointercapture',off)});
const fireOn=e=>{e.preventDefault();keys.fire=true;try{$('fire').setPointerCapture(e.pointerId)}catch(_){}};const fireOff=e=>{e.preventDefault();keys.fire=false};$('fire').addEventListener('pointerdown',fireOn);$('fire').addEventListener('pointerup',fireOff);$('fire').addEventListener('pointercancel',fireOff);$('fire').addEventListener('lostpointercapture',fireOff);
addEventListener('keydown',e=>{let k=e.key.toLowerCase();if(k==='w'||k==='arrowup')keys.up=true;if(k==='s'||k==='arrowdown')keys.down=true;if(k==='a'||k==='arrowleft')keys.left=true;if(k==='d'||k==='arrowright')keys.right=true;if(k===' ')keys.fire=true});
addEventListener('keyup',e=>{let k=e.key.toLowerCase();if(k==='w'||k==='arrowup')keys.up=false;if(k==='s'||k==='arrowdown')keys.down=false;if(k==='a'||k==='arrowleft')keys.left=false;if(k==='d'||k==='arrowright')keys.right=false;if(k===' ')keys.fire=false});
document.addEventListener('contextmenu',e=>e.preventDefault());hud();function loop(t){let dt=Math.min((t-last)/1000||0,.035);last=t;update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
})();
</script>
</body></html>
